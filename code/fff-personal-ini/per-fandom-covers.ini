## Per-fandom cover generation
## ─────────────────────────────
## Add to your [archiveofourown.org] section.
##
## First save a Generate Cover preset named "Classics Sherlock",
## or replace that name with one of your own saved presets.
##
## Rules are checked top to bottom — first match wins.
## Put your most specific rules first. If your [archiveofourown.org]
## section or generate_cover_settings block already exists, add only
## the indented rule below to it; do not repeat either heading.
## The default cover (set in the FFF GUI) applies to anything that
## doesn't match.

[archiveofourown.org]
generate_cover_settings:
    ## Fandom-specific rule. Simple names work as patterns.
    ${category} => [Ss]herlock                   => Classics Sherlock

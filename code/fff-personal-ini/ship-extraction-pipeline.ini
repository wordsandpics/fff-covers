## Ordered slash relationship pipeline — defaults section
## ──────────────────────────────────────────────────────
## Add to your [defaults] section.
##
## This saves FFF's ship list before Calibre can put it in alphabetical
## order. It leaves out friendship tags using & and saves the remaining
## list in the #all_slashes Calibre column.
##
## Prerequisites:
##   - #all_slashes column in Calibre
##     (Long text, like comments, not shown in the Tag browser)
##   - The column mapping in ship-column-mappings.ini added to
##     [archiveofourown.org]

[defaults]
## Tell FFF that all_slashes is a new name we want to use.
## Keep the comma before all_slashes.
add_to_extra_valid_entries: ,all_slashes

## Copy the ship list before its order changes.
include_in_all_slashes: ships

## Tell FFF to keep the original order.
keep_in_order_ships:true
keep_in_order_all_slashes:true

## Keep tags containing / and leave out friendship tags using &.
include_metadata_pre:
    all_slashes=~/

## Ordered slash relationship pipeline — archiveofourown.org section
## ─────────────────────────────────────────────────────────────────
## Add to your [archiveofourown.org] section.
##
## This tells FFF to put all_slashes into the #all_slashes Calibre
## column. The first half of the setup is in ship-extraction-pipeline.ini.

[archiveofourown.org]
add_to_custom_columns_settings:
    all_slashes=>#all_slashes


## ── Optional: per-ship cover templates ────────────────────────────
##
## Use the first ship in all_slashes to choose a cover preset.
## Add these rules above fandom rules because the first match wins.
##
## Uncomment and edit to use:
# generate_cover_settings:
#     ${all_slashes} => ^\s*Character A/Character B(?:\s*,|$) => Your Preset Name
#     ${all_slashes} => ^\s*Character C/Character D(?:\s*,|$) => Your Other Preset
#     ${category}    => FandomName                         => Your Fandom Preset

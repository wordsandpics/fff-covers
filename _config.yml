title: fff-covers
description: Automatic cover generation for fanfiction — a guide for FanFicFare + Calibre users
baseurl: "/fff-covers"
url: "https://wordsandpics.github.io"

# Build
markdown: kramdown
highlighter: rouge
permalink: pretty

# Exclude from build
exclude:
  - README.md
  - RESTRUCTURE_PLAN.md
  - scripts
  - tests
  - Gemfile
  - Gemfile.lock

# Navigation
nav:
  - title: Start here
    pages:
      - label: Overview
        url: /
      - label: 1. Create your first cover
        url: /start/first-cover/
      - label: 2. Set up your artwork
        url: /start/artwork/
      - label: 3. Add AO3 metadata
        url: /start/metadata/
      - label: 4. Generate covers with your metadata
        url: /start/generate-covers/
  - title: Cover content
    pages:
      - label: Word and chapter count
        url: /display/length/
      - label: Status
        url: /display/status/
      - label: Ships
        url: /display/ships/
      - label: Genres and flags
        url: /display/genres/
      - label: Genre code generator
        url: /display/genres/code-generator/
        subitem: true
      - label: Advanced display options
        url: /display/combining-fields/
  - title: Choose a cover
    pages:
      - label: By fandom
        url: /choose/fandom/
      - label: By ship or tag
        url: /choose/ship-or-genre/
      - label: Original works and fallbacks
        url: /choose/fallbacks/
      - label: Long titles
        url: /choose/long-titles/
      - label: Protect custom covers
        url: /choose/protect-covers/
  - title: Advanced options
    pages:
      - label: Anthology-aware ships
        url: /advanced/anthology-ships/
      - label: Ship code generator
        url: /display/ships/code-generator/
        subitem: true
      - label: Chapter-aware and dormant status
        url: /advanced/status/
      - label: Precise tag matching
        url: /advanced/tag-matching/
      - label: Metadata cleanup
        url: /advanced/metadata-cleanup/
      - label: Likeability score
        url: /advanced/likeability/
  - title: Reference
    pages:
      - label: Troubleshooting
        url: /reference/troubleshooting/
      - label: Downloads
        url: /reference/downloads/
      - label: Changelog
        url: /reference/changelog/
      - label: Contact
        url: /contact/
